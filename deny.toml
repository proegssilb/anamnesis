# cargo-deny configuration, run by the `deny` job in .forgejo/workflows/ci.yml
# (`cargo deny check advisories bans sources`).
# Reference: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

# RustSec advisory database. Any vulnerability advisory against a crate in
# Cargo.lock fails the check. Do not silence one with `ignore` unless it
# demonstrably does not apply to how this workspace uses the crate, and say
# why next to the ID.
[advisories]
version = 2
# Unmaintained-crate notices fail too, for direct and transitive
# dependencies alike: they are how RustSec flags a crate that will not get
# the next security fix.
unmaintained = "all"
# A yanked version in Cargo.lock was withdrawn by its own author; never ship
# one knowingly.
yanked = "deny"
ignore = [
    # Marvin Attack: `rsa`'s private-key operations (decrypt/sign) leak
    # timing. No patched release exists. It does not apply here: in the
    # shipped binary `rsa` is reached only through `openidconnect`, and only
    # to *verify* ID-token signatures with the provider's public JWKS keys --
    # anamnesis holds no RSA private key and authenticates to the provider
    # with a client secret, so there is no private-key operation to time.
    # The one private-key use is the dev-dependency in
    # anamnesis-adapters/tests/identity_provider.rs, which signs test tokens
    # with a throwaway key generated in-process -- the local, offline use the
    # advisory itself calls fine. Revisit if anamnesis ever signs or
    # decrypts with RSA (e.g. `private_key_jwt` client auth or encrypted ID
    # tokens), and drop this once a patched `rsa` is in Cargo.lock.
    { id = "RUSTSEC-2023-0071", reason = "rsa used only for public-key JWT verification in production; private key only in offline tests" },
    # ammonia mutation XSS via MathML/SVG namespace confusion. Exploitable only
    # when the sanitizer allows one of HTML's raw-text elements (title,
    # textarea, xmp, iframe, noembed, noframes, plaintext, noscript, style,
    # script) as the gadget. anamnesis-web's markdown renderer allows none of
    # them, nor `math` or `svg` (ALLOWED_TAGS in handlers/markdown.rs), and
    # `strip_html` allows no tags at all. The fix, 4.2.5, was published the
    # same day as the advisory (2026-11-13), so it is not taken early past
    # the 14-day age gate for a vulnerability that does not apply. Drop this
    # once 4.2.5 is in Cargo.lock; revisit at once if ALLOWED_TAGS ever gains
    # a raw-text element, `math`, or `svg`.
    { id = "RUSTSEC-2026-0533", reason = "no raw-text element, math or svg is in ammonia's allowlist; fix not yet 14 days old" },
    # Bundled SQLite (< 3.54.0) can return uninitialized page-cache memory
    # when opening a database together with a `-wal` file that a less trusted
    # party wrote. anamnesis opens only the databases at its own
    # operator-configured URL (ANAMNESIS_DATABASE_URL and the lease database
    # derived from it), in its own state directory; nothing user-supplied is
    # ever opened as SQLite. The fix needs libsqlite3-sys >= 0.39, and
    # sqlx-sqlite 0.9.0, the newest release, caps it below 0.38 -- there is
    # nothing to upgrade to yet. Drop this when an sqlx release allows
    # libsqlite3-sys >= 0.39 and Cargo.lock has it; revisit at once if
    # anamnesis ever opens a database file it did not create (e.g. a restore
    # or import feature).
    { id = "RUSTSEC-2026-0459", reason = "only operator-configured databases are opened; no sqlx release allows the fixed libsqlite3-sys yet" },
    # chrono is unmaintained (chronotope/chrono#1768); all versions are
    # flagged and no safe upgrade exists. anamnesis's own production code
    # uses `time`/`jiff` instead -- `time = "0.3.55"` is a direct dep of
    # anamnesis-core, anamnesis-web and anamnesis-adapters, and no .rs file
    # in the workspace references `chrono`. The two transitive pulls are
    # `openidconnect`/`oauth2` and `object_store`, both of which pin their
    # own chrono requirement (the advisory's "no safe upgrade" path) and
    # have no chrono-free release yet. The only direct use is the
    # dev-dependency in anamnesis-adapters/tests/identity_provider.rs, which
    # computes StandardClaims' expires_at/issued_at offsets for a mock OIDC
    # token -- test-only, offline, never shipped. Drop this once
    # openidconnect, oauth2 and object_store all publish releases that no
    # longer depend on chrono (and the dev-dep is replaced by `time`/`jiff`
    # at that point).
    { id = "RUSTSEC-2026-0543", reason = "no anamnesis production code uses chrono; transitive via openidconnect/oauth2/object_store, plus one offline test; no chrono-free release of those upstreams yet" },
    # humantime is flagged because it wraps chrono (RUSTSEC-2026-0543 above),
    # not for its own reasons. It is not a direct dep of any crate in this
    # workspace and no .rs file references it; it enters the graph only as a
    # transitive requirement of `object_store` (prod path, anamnesis-adapters
    # S3 backend) and `cucumber` (dev-dep of anamnesis-app, BDD tests).
    # Neither upstream has a humantime-free release yet. Drop this once both
    # publish one.
    { id = "RUSTSEC-2026-0542", reason = "humantime is a transitive requirement of object_store and cucumber only; no direct use; no upstream release drops it yet" },
]

# Only crates.io. A dependency from any other registry or straight from a
# git repository bypasses both crates.io's immutability and the 14-day age
# gate (scripts/check_lock_age.py), so it must be a deliberate change here.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Not used as a ban list: duplicate versions are reported for information
# only, since most come from upstream crates' own requirements.
[bans]
multiple-versions = "warn"
