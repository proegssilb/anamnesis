[workspace]
resolver = "3"
# `job-lease` carries no `anamnesis-` prefix on purpose: it is not a hexagonal
# layer of this application, but a generic crate that happens to live here.
members = [
    "crates/anamnesis-core",
    "crates/anamnesis-app",
    "crates/anamnesis-adapters",
    "crates/anamnesis-web",
    "crates/job-lease",
]

[workspace.package]
edition = "2024"

[profile.release]
# Debug symbols are a large fraction of the binary and are of no use in a
# container image or a release artifact; a backtrace still names functions.
strip = true
