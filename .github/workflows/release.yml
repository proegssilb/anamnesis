# Publishes a release on a version tag: a multi-arch container image to
# GHCR, plus stripped binaries attached to the GitHub Release so a VM
# install needs no Rust toolchain (see docs/DEPLOYMENT.md).
#
# This repository on GitHub is a push mirror of the Forgejo one, where
# development and CI happen (.forgejo/workflows/). The tag arrives here with
# the mirror push; .forgejo/workflows/release.yml publishes the same tag to
# Forgejo's own registry and releases.
#
# Every third-party action is pinned to a full commit SHA with its version in
# a trailing comment. A tag is a mutable pointer -- whoever controls the
# action's repository can move `v3` -- and this workflow holds a token that can
# push images to GHCR and write releases, so a moved tag is a supply-chain
# compromise of exactly the artifacts users install. That holds for the
# `actions/` org's own actions too: their tags are just as movable, and the
# `release` job runs download-artifact with a token that can write releases.
# Update a pin by bumping both the SHA and the comment together, never the
# comment alone; Renovate (`helpers:pinGitHubActionDigests`) does exactly
# that, and reads the comment to know which version a SHA is.
#
# No job here pushes to git, so every checkout sets persist-credentials: false
# and leaves no token in .git/config for later steps to find.
name: release

on:
  push:
    tags:
      - "v*"

# Read-only by default, so a job that forgets its own block cannot write.
# Each job below widens this only as far as it actually needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # One native runner per architecture rather than one runner building both
  # under QEMU. Emulated Rust builds of this size take long enough that the
  # second runner is cheaper than the emulation.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each arch pushes by digest only; the `manifest` job below is what
      # attaches the human-readable tags to the resulting manifest list.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # The filename is the bare hex digest; the manifest job globs these
      # back into `image@sha256:<digest>` references.
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

  # Native builds again, for the same reason. These are what
  # deploy/cloud-init/user-data.example.yaml downloads.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This action's `stable` ref is a branch, so there is no version tag to
      # name here; it resolves the current stable Rust at run time regardless.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # `[profile.release] strip = true` in the workspace Cargo.toml means
      # this needs no separate strip step.
      - run: cargo build --release --locked --bin anamnesis-web

      - run: |
          install -D target/release/anamnesis-web \
            "dist/anamnesis-web-${{ matrix.arch }}-unknown-linux-gnu"
          sha256sum "dist/anamnesis-web-${{ matrix.arch }}-unknown-linux-gnu" \
            > "dist/anamnesis-web-${{ matrix.arch }}-unknown-linux-gnu.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [manifest, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          # A `-` in the tag (v1.2.3-rc.1) is a pre-release: mark it so, or
          # GitHub makes it "latest" and every releases/latest/download URL
          # (deploy/cloud-init, docs/DEPLOYMENT.md) starts serving it. The
          # image job's `latest` tag already follows the same rule.
          prerelease: ${{ contains(github.ref_name, '-') }}
