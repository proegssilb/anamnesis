name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Supply-chain gate: `lock-age`, `deny` and `socket` only read Cargo.lock,
  # Cargo.toml and package metadata -- none of them compiles anything. Every
  # job that does compile (`check`, `postgres`, `coverage`) runs dependency
  # build scripts and proc macros on the runner, so it `needs:` all three
  # gates to pass first. Otherwise a too-new, advisory-flagged or
  # Socket-flagged dependency would already have executed (with `coverage`'s
  # CODACY_PROJECT_TOKEN in reach) by the time its check failed.

  # fmt + clippy + the full workspace test suite (Postgres contract test
  # excluded here — it is #[ignore]d by default and covered by the
  # `postgres` job below, against a real database).
  check:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-latest
    needs: [lock-age, deny, socket]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  # Every crates.io package version newly added to Cargo.lock must be at
  # least 14 days old, matching renovate.json's `minimumReleaseAge`. Renovate
  # only holds the requirement it bumps to that rule; this catches what the
  # lockfile resolves transitively, and a manual `cargo update`. Exceptions
  # go in .github/lock-age-allow.toml with a reason.
  lock-age:
    name: Cargo.lock package age
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history, so the base revision below is present to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check newly locked crate versions are at least 14 days old
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous revision to compare against (new branch); skipping."
            exit 0
          fi
          python3 scripts/check_lock_age.py --base "$BASE_SHA"

  # RustSec advisories against Cargo.lock, and crates.io as the only allowed
  # source. Policy and any advisory exceptions live in deny.toml.
  deny:
    name: cargo-deny (advisories, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the dependency graph via `cargo metadata`, so it
      # needs a cargo new enough for this workspace's manifests.
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The same install-action pin as the coverage job (the `tool` input
      # overrides that ref's cargo-llvm-cov default). Its pinned manifest
      # carries the SHA-256 of the cargo-deny release binary and verifies it;
      # `fallback: none` makes it fail rather than fall back to an
      # unverified cargo-binstall if that version were ever missing.
      - name: Install cargo-deny
        uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: cargo deny check
        run: cargo deny --locked check advisories bans sources

  # Socket.dev behavioral analysis of the dependency tree: malware, install/
  # build scripts, network and filesystem access, obfuscation, maintainer
  # changes -- the "nobody has looked at this new version" gap that the age
  # gate and RustSec advisories don't cover. `socket ci` (= `socket scan
  # create --report`) uploads the manifests it finds (Cargo.toml/Cargo.lock;
  # no --auto-manifest, so it runs no build tooling), waits for the verdict,
  # and exits non-zero if any alert hits a policy action of `error` in the
  # Socket org's security policy.
  #
  # The token comes from the SOCKET_CLI_API_TOKEN repository secret (the
  # variable the CLI reads first; no `socket login` needed). Without it the
  # job fails rather than passing unscanned -- including on PRs from forks,
  # which don't receive secrets.
  socket:
    name: Socket dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned CLI version (Renovate bumps it, subject to the 14-day
      # minimumReleaseAge). The pin alone doesn't age-gate the CLI's own
      # transitive npm dependencies, which are version ranges, so --before
      # caps resolution at packages published 14+ days ago. --ignore-scripts:
      # nothing in the tree runs install scripts. --omit=optional skips the
      # prebuilt native `socket-patch` binaries, which `socket ci` doesn't use.
      - name: Install Socket CLI
        run: |
          npm install --global --ignore-scripts --omit=optional --no-audit --no-fund \
            --before="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
            socket@1.10.1

      - name: socket ci
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
        run: |
          if [ -z "$SOCKET_CLI_API_TOKEN" ]; then
            echo "::error::SOCKET_CLI_API_TOKEN secret is not available to this run; refusing to pass unscanned."
            exit 1
          fi
          socket ci

  # Runs the Postgres side of the SqlStore contract (crates/anamnesis-adapters/tests/sql_store_contract.rs),
  # which is #[ignore]d in the default `check` job above. A postgres:16
  # service container backs it; the health-check keeps the job from racing
  # the database coming up.
  postgres:
    name: adapter contract tests (Postgres)
    runs-on: ubuntu-latest
    needs: [lock-age, deny, socket]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: anamnesis
          POSTGRES_PASSWORD: anamnesis
          POSTGRES_DB: anamnesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anamnesis -d anamnesis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANAMNESIS_TEST_PG_URL: postgres://anamnesis:anamnesis@localhost:5432/anamnesis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: postgres

      - name: cargo test -p anamnesis-adapters -- --ignored
        run: cargo test -p anamnesis-adapters --test sql_store_contract -- --ignored

  # Generates coverage for the same test set as the `check` job (Postgres
  # contract test excluded) and uploads it to Codacy. Skipped for PRs from
  # forks, since the CODACY_PROJECT_TOKEN secret isn't available to them.
  coverage:
    name: coverage (Codacy)
    runs-on: ubuntu-latest
    needs: [lock-age, deny, socket]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: lcov.info
