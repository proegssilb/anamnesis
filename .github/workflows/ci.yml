name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # fmt + clippy + the full workspace test suite (Postgres contract test
  # excluded here — it is #[ignore]d by default and covered by the
  # `postgres` job below, against a real database).
  check:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  # Every crates.io package version newly added to Cargo.lock must be at
  # least 14 days old, matching renovate.json's `minimumReleaseAge`. Renovate
  # only holds the requirement it bumps to that rule; this catches what the
  # lockfile resolves transitively, and a manual `cargo update`. Exceptions
  # go in .github/lock-age-allow.toml with a reason.
  lock-age:
    name: Cargo.lock package age
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history, so the base revision below is present to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check newly locked crate versions are at least 14 days old
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous revision to compare against (new branch); skipping."
            exit 0
          fi
          python3 scripts/check_lock_age.py --base "$BASE_SHA"

  # Runs the Postgres side of the SqlStore contract (crates/anamnesis-adapters/tests/sql_store_contract.rs),
  # which is #[ignore]d in the default `check` job above. A postgres:16
  # service container backs it; the health-check keeps the job from racing
  # the database coming up.
  postgres:
    name: adapter contract tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: anamnesis
          POSTGRES_PASSWORD: anamnesis
          POSTGRES_DB: anamnesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anamnesis -d anamnesis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANAMNESIS_TEST_PG_URL: postgres://anamnesis:anamnesis@localhost:5432/anamnesis_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: postgres

      - name: cargo test -p anamnesis-adapters -- --ignored
        run: cargo test -p anamnesis-adapters --test sql_store_contract -- --ignored

  # Generates coverage for the same test set as the `check` job (Postgres
  # contract test excluded) and uploads it to Codacy. Skipped for PRs from
  # forks, since the CODACY_PROJECT_TOKEN secret isn't available to them.
  coverage:
    name: coverage (Codacy)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: lcov.info
