[package]
name = "anamnesis-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
anamnesis-core = { version = "0.1.0", path = "../anamnesis-core" }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uuid = "1.25.0"

[dev-dependencies]
cucumber = "0.23.0"
rstest = "0.26.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "cucumber"
harness = false
