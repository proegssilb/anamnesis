[package]
name = "anamnesis-core"
version = "1.0.0"
edition.workspace = true
# This is an application crate, not a library anyone should depend on; only
# `job-lease` in this workspace is meant for crates.io.
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "serde"] }
uuid = { version = "1.25.0", features = ["serde"] }

[dev-dependencies]
rstest = "0.26.1"
