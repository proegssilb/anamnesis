<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A sun half-risen over the horizon: the part below the line is dimmed,
       not gone — "what's below the horizon isn't gone, it's just not up yet." -->
  <rect width="64" height="64" rx="12" fill="#1c2733"/>
  <path d="M15 37 A17 17 0 0 0 49 37 Z" fill="#2d6cdf" fill-opacity="0.35"/>
  <path d="M15 37 A17 17 0 0 1 49 37 Z" fill="#6ea1ff"/>
  <rect x="7" y="35.5" width="50" height="3.5" rx="1.75" fill="#eef1f5"/>
</svg>
