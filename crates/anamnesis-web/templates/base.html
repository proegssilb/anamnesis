<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2733">
  <title>{% block title %}Anamnesis{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <header class="site-header">
    <nav class="brand-nav">
      <a class="brand" href="/areas">Anamnesis</a>
      {% if current_user %}<a class="nav-link" href="/board">Board</a>{% endif %}
    </nav>
    {% if current_user %}
      <form class="logout-form" method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <span class="current-user">{{ current_user }}</span>
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
