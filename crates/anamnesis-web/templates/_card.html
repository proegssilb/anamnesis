<article class="card" id="card-{{ card.id }}">
  <h3 class="card-title">{{ card.title }}</h3>
  {% if card.body %}<p class="card-body">{{ card.body }}</p>{% endif %}

  <form class="card-move-form" method="post" action="/boards/{{ board_id }}/cards/{{ card.id }}/move">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="visually-hidden" for="move-to-column-{{ card.id }}">Move to column</label>
    <select id="move-to-column-{{ card.id }}" name="to_column">
      {% for column in columns %}
        <option value="{{ column.id }}" {% if column.id == current_column_id %}selected{% endif %}>{{ column.title }}</option>
      {% endfor %}
    </select>
    <label class="visually-hidden" for="move-to-index-{{ card.id }}">Position</label>
    <input id="move-to-index-{{ card.id }}" name="to_index" type="number" min="0" value="{{ card_index }}" inputmode="numeric">
    <button type="submit">Move</button>
  </form>

  <form class="card-delete-form" method="post" action="/boards/{{ board_id }}/cards/{{ card.id }}/delete">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="danger">Delete</button>
  </form>
</article>
