[package]
name = "anamnesis-web"
version = "0.1.0"
edition.workspace = true

[dependencies]
anamnesis-adapters = { version = "0.1.0", path = "../anamnesis-adapters" }
anamnesis-app = { version = "0.1.0", path = "../anamnesis-app" }
anamnesis-core = { version = "0.1.0", path = "../anamnesis-core" }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
minijinja = "2.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "parsing"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.25.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_urlencoded = "0.7.1"
tempfile = "3.27.0"
