[package]
name = "job-lease"
version = "0.1.0"
edition.workspace = true
description = "Expiry-based leases in an ordinary SQL table, so exactly one process out of several runs a given named job. Works on both SQLite and Postgres."
license = "BSD-3-Clause"
repository = "https://github.com/proegssilb/anamnesis"
readme = "README.md"
keywords = ["lease", "leader-election", "singleton", "sqlx", "coordination"]
categories = ["database", "concurrency"]
# Deferred, not cancelled: this crate is written to publishable standards, but
# stays a path dependency until the lease has run multi-instance through a
# release cycle and the API has settled. Flip to `true` (i.e. delete this line)
# when publishing; confirm the name with `cargo publish --dry-run` first.
publish = false

[dependencies]
async-trait = "0.1.92"
thiserror = "2.0.20"
# No TLS feature is requested on purpose. A consumer builds its own pool and so
# picks its own TLS backend; forcing one here would impose that choice on every
# downstream user.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres", "migrate"] }

[dev-dependencies]
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
