name: CI

# Forgejo Actions. Forgejo reads .forgejo/workflows/ and, because it exists,
# ignores .github/workflows/ -- that directory is for the GitHub mirror only.
#
# Actions are referenced by full https://github.com/... URL: this instance's
# default action source (data.forgejo.org) mirrors only a few of them. Every
# third-party action is pinned to a commit SHA with its version in a trailing
# comment; bump both together.
#
# Jobs run on runner01 (homelab-infra) in a catthehacker act-24.04 image under
# the `ubuntu-latest` label, each job in its own Docker network.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Supply-chain gate: `lock-age`, `deny` and `socket` only read Cargo.lock,
  # Cargo.toml and package metadata -- none of them compiles anything. Every
  # job that does compile (`check`, `postgres`, `coverage`) runs dependency
  # build scripts and proc macros on the runner, so it `needs:` all three
  # gates to pass first. Otherwise a too-new, advisory-flagged or
  # Socket-flagged dependency would already have executed on the runner by
  # the time its check failed. `quality`, `sast` and `secrets` read source
  # only and run in parallel with the gate.

  # fmt + clippy + the full workspace test suite (Postgres contract test
  # excluded here — it is #[ignore]d by default and covered by the
  # `postgres` job below, against a real database).
  check:
    name: fmt, clippy, test (stable)
    runs-on: ubuntu-latest
    needs: [lock-age, deny, socket]
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: https://github.com/dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build output
        uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

  # Every crates.io package version newly added to Cargo.lock must be at
  # least 14 days old, matching renovate.json's `minimumReleaseAge`. Renovate
  # only holds the requirement it bumps to that rule; this catches what the
  # lockfile resolves transitively, and a manual `cargo update`. Exceptions
  # go in .github/lock-age-allow.toml with a reason.
  lock-age:
    name: Cargo.lock package age
    runs-on: ubuntu-latest
    steps:
      # Full history, so the base revision below is present to diff against.
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check newly locked crate versions are at least 14 days old
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous revision to compare against (new branch); skipping."
            exit 0
          fi
          python3 scripts/check_lock_age.py --base "$BASE_SHA"

  # RustSec advisories against Cargo.lock, and crates.io as the only allowed
  # source. Policy and any advisory exceptions live in deny.toml.
  deny:
    name: cargo-deny (advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny reads the dependency graph via `cargo metadata`, so it
      # needs a cargo new enough for this workspace's manifests.
      - name: Install stable Rust
        uses: https://github.com/dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The same install-action pin as the coverage job (the `tool` input
      # overrides that ref's cargo-llvm-cov default). Its pinned manifest
      # carries the SHA-256 of the cargo-deny release binary and verifies it;
      # `fallback: none` makes it fail rather than fall back to an
      # unverified cargo-binstall if that version were ever missing.
      - name: Install cargo-deny
        uses: https://github.com/taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: cargo deny check
        run: cargo deny --locked check advisories bans sources

  # Socket.dev behavioral analysis of the dependency tree: malware, install/
  # build scripts, network and filesystem access, obfuscation, maintainer
  # changes -- the "nobody has looked at this new version" gap that the age
  # gate and RustSec advisories don't cover. `socket ci` (= `socket scan
  # create --report`) uploads the manifests it finds (Cargo.toml/Cargo.lock;
  # no --auto-manifest, so it runs no build tooling), waits for the verdict,
  # and exits non-zero if any alert hits a policy action of `error` in the
  # Socket org's security policy.
  #
  # The token comes from the SOCKET_CLI_API_TOKEN repository secret (the
  # variable the CLI reads first; no `socket login` needed). Without it the
  # job fails rather than passing unscanned.
  socket:
    name: Socket dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned CLI version (Renovate bumps it, subject to the 14-day
      # minimumReleaseAge). The pin alone doesn't age-gate the CLI's own
      # transitive npm dependencies, which are version ranges, so --before
      # caps resolution at packages published 14+ days ago. --ignore-scripts:
      # nothing in the tree runs install scripts. --omit=optional skips the
      # prebuilt native `socket-patch` binaries, which `socket ci` doesn't use.
      - name: Install Socket CLI
        run: |
          npm install --global --ignore-scripts --omit=optional --no-audit --no-fund \
            --before="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
            socket@1.12.1

      - name: socket ci
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}
        run: |
          if [ -z "$SOCKET_CLI_API_TOKEN" ]; then
            echo "::error::SOCKET_CLI_API_TOKEN secret is not available to this run; refusing to pass unscanned."
            exit 1
          fi
          socket ci

  # Runs the Postgres side of the SqlStore contract (crates/anamnesis-adapters/tests/sql_store_contract.rs),
  # which is #[ignore]d in the default `check` job above. The job runs in a
  # container on the same per-job network as the service, so the database is
  # reached by its service name; no host port is published (two concurrent
  # jobs on runner01 would collide on 5432).
  postgres:
    name: adapter contract tests (Postgres)
    runs-on: ubuntu-latest
    needs: [lock-age, deny, socket]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: anamnesis
          POSTGRES_PASSWORD: anamnesis
          POSTGRES_DB: anamnesis_test
        options: >-
          --health-cmd "pg_isready -U anamnesis -d anamnesis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANAMNESIS_TEST_PG_URL: postgres://anamnesis:anamnesis@postgres:5432/anamnesis_test
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: https://github.com/dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo registry and build output
        uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: postgres

      - name: cargo test -p anamnesis-adapters -- --ignored
        run: cargo test -p anamnesis-adapters --test sql_store_contract -- --ignored

  # Line/region coverage for the same test set as `check`, printed as a
  # per-file table in the job log. Main only: it is a third full build, and
  # the number is a trend to read, not a gate.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [lock-age, deny, socket]
    if: github.event_name == 'push'
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: https://github.com/dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry and build output
        uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        uses: https://github.com/taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --workspace --summary-only

  # Function complexity, the check Codacy ran on GitHub PRs: the same
  # thresholds as `just lizard` (CCN 10, 50 NLOC), and the same lizard version
  # as the local gate, so a clean `just quality` means a clean job. See
  # CLAUDE.md on fixing the design rather than the metric.
  quality:
    name: complexity (lizard)
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hash-pinned, dependencies included (--no-deps: nothing resolves
      # beyond the file). A venv, because the image's system Python is
      # externally managed (PEP 668).
      - name: Install lizard
        run: |
          python3 -m venv "$RUNNER_TEMP/lizard"
          "$RUNNER_TEMP/lizard/bin/pip" install --quiet --no-deps --require-hashes \
            -r .forgejo/lizard-requirements.txt

      - name: lizard (keep in step with the justfile's `lizard` recipe)
        run: '"$RUNNER_TEMP/lizard/bin/python" -m lizard -l rust crates -T nloc=50 -C 10 -w'

  # Static analysis for security bugs (what CodeQL did on GitHub): opengrep
  # with the community rule set for the languages in this repository. Fails
  # on ERROR-severity findings only, like the GitHub ruleset's CodeQL gate.
  sast:
    name: SAST (opengrep)
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release binary, verified against the SHA-256 GitHub records for the
      # v1.32.0 asset.
      - name: Install opengrep
        run: |
          curl -sSfL -o "$RUNNER_TEMP/opengrep" \
            https://github.com/opengrep/opengrep/releases/download/v1.32.0/opengrep_manylinux_x86
          echo "7360d60174880bd9214f2dfbe439b7bce82b7a3d44cfe945ba833c85cc8bda75  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep"

      # Rules at a pinned commit of opengrep/opengrep-rules.
      - name: Fetch rules
        run: |
          git init --quiet "$RUNNER_TEMP/rules"
          git -C "$RUNNER_TEMP/rules" fetch --quiet --depth 1 \
            https://github.com/opengrep/opengrep-rules f1d2b562b414783763fd02a6ed2736eaed622efa
          git -C "$RUNNER_TEMP/rules" checkout --quiet FETCH_HEAD

      - name: opengrep scan
        run: |
          R="$RUNNER_TEMP/rules"
          "$RUNNER_TEMP/opengrep" scan --error --severity ERROR \
            --config "$R/rust" --config "$R/python" --config "$R/javascript" \
            --config "$R/dockerfile" --config "$R/yaml/github-actions" \
            .

  # Credentials committed by mistake (what GitHub's secret scanning and push
  # protection did). Scans exactly the commits this push or PR adds, so a
  # finding names the commit that introduced it.
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Scan new commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BASE_SHA..HEAD"
          fi
          echo "Scanning $RANGE"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$RANGE" .
